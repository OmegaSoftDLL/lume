name: CodeQL

# Scope note: CodeQL's `c-cpp` extractor analyzes only the disposable Stage-0 C seed (`bootstrap/lume0/*.c`),
# and `actions` analyzes `.github/workflows/*.yml`. Because GitHub CodeQL has no native Lume extractor, the
# self-hosted Lume compiler (`compiler/stage1/lume/*.src`, `compiler/stage1/*.src`) is verified by Lume's own
# static analyzers (`lcaas`, `lume prove`, `make bootstrap`, `make zero-c`) in `ci.yml`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Stage 0 C seed (bootstrap/lume0)
        if: matrix.language == 'c-cpp'
        run: make -C bootstrap/lume0 clean && make -C bootstrap/lume0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
