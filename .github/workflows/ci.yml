name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stage0:
    name: Stage 0 (lume0, C) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install QEMU (Linux x86-64 bare-metal kernel boot #227 & cross-ISA AArch64/RISC-V #206)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-user
      - name: Build
        run: make -C bootstrap/lume0
      - name: Test
        run: make -C bootstrap/lume0 test
      - name: Test under ASan/UBSan
        run: make -C bootstrap/lume0 asan

  docs:
    name: Documentation & examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required files exist
        run: |
          set -e
          for f in README.md CHANGELOG.md .github/workflows/release.yml \
                   docs/00-catalog.md docs/01-survey.md docs/02-principles.md \
                   docs/03-specification.md docs/04-roadmap.md docs/05-vision.md \
                   grammar/lume.ebnf examples/README.md \
                   formal/lean/LumeCore.lean formal/lean/README.md \
                   tests/llm_gen_eval/system_prompt.md scripts/check-llm-gen-eval.sh; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Mechanised Lume-Core proofs in Lean 4 (#213 — zero sorry/axiom)
        run: |
          set -e
          ! grep -En '\bsorry\b|\baxiom\b' formal/lean/LumeCore.lean || { echo "sorry/axiom found in formal/lean/LumeCore.lean"; exit 1; }
          for i in 1 2 3; do
            curl --retry 3 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.14.0 && break || sleep 5
          done
          "$HOME/.elan/bin/lean" formal/lean/LumeCore.lean
      - name: Every example is listed in examples/README.md
        run: |
          set -e
          for f in examples/*.lume examples/future/*.lume; do
            name=${f#examples/}
            grep -q "$name" examples/README.md || { echo "$name not listed in examples/README.md"; exit 1; }
          done
      - name: No tabs in Lume sources or docs
        run: |
          ! grep -rnP '\t' --include='*.lume' --include='*.md' --include='*.ebnf' --exclude='bad_*.lume' . || { echo "tabs found"; exit 1; }
      - name: Canonical formatting check (lume fmt --check)
        run: |
          set -e
          files=$(find . -name '*.lume' -not -name 'bad_*' -not -path './.git/*' | sort)
          if [ -n "$files" ]; then
            ./lume fmt --check $files
          fi
      - name: Spec cites principles that exist
        run: |
          set -e
          for p in $(grep -oE '\bP[0-9]+\b' docs/03-specification.md | sort -u); do
            grep -q "\*\*$p " docs/02-principles.md || { echo "spec cites $p but principles.md lacks it"; exit 1; }
          done

  bootstrap:
    name: Self-host bootstrap (stage2 == stage3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: make bootstrap
        run: make bootstrap
      - name: Canonical Lume-Core & surface formatting check (lume fmt --check)
        run: |
          set -e
          files=$(find . -name '*.lume' -not -name 'bad_*' -not -path './.git/*' | sort)
          if [ -n "$files" ]; then
            ./lume fmt --check compiler/stage1/f4_core.src $files
          else
            ./lume fmt --check compiler/stage1/f4_core.src
          fi

  zero-c:
    name: Zero-C steady state (no cc/as/ld)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: make zero-c
        run: make zero-c

  windows-pe:
    name: Native Windows x64 PE32+ & WASI Run-Verification (#206)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build lume0 (64 MB stack) and run-verify x86_64-windows-pe & wasm32-wasi
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          gcc -std=c11 -O2 -Wl,--stack,67108864 -o bootstrap/lume0/lume0.exe (Get-ChildItem bootstrap/lume0/*.c)
          $lume0 = (Resolve-Path bootstrap/lume0/lume0.exe).Path
          $srcOk = "fn fib(n: int) -> int = if n < 2 then n else fib(n - 1) + fib(n - 2)`nfn clamp_pos(x: int) -> int requires x >= 0 ensures result >= 5 = x + 5`nprint fib(10)`nprint clamp_pos(37)`n"
          $srcTrap = "fn sq_not49(x: int) -> int ensures result != 49 = x * x`nprint sq_not49(7)`n"
          function Compile-Target($triple, $body) {
              $inFile = Join-Path $env:TEMP "lt_in.txt"
              [System.IO.File]::WriteAllText($inFile, "@compile $triple`n$body")
              Push-Location compiler/stage1
              $res = & $lume0 run "compiler_in_core.lume" "ltarget.src" $inFile
              Pop-Location
              $hex = ($res -split ":")[2].Trim()
              $bytes = [byte[]]::new($hex.Length / 2)
              for ($i = 0; $i -lt $bytes.Length; $i++) {
                  $bytes[$i] = [Convert]::ToByte($hex.Substring($i * 2, 2), 16)
              }
              return $bytes
          }
          $winOk = Join-Path $env:TEMP "ut_win64_ok.exe"
          $winTrap = Join-Path $env:TEMP "ut_win64_trap.exe"
          [System.IO.File]::WriteAllBytes($winOk, (Compile-Target "x86_64-windows-pe" $srcOk))
          [System.IO.File]::WriteAllBytes($winTrap, (Compile-Target "x86_64-windows-pe" $srcTrap))
          $wOut = (& $winOk) -join ","
          $wRcOk = $LASTEXITCODE
          & $winTrap
          $wRcTrap = $LASTEXITCODE
          Write-Host "PE64 OK: '$wOut' (rc=$wRcOk) | TRAP: rc=$wRcTrap"
          if ($wOut -ne "55,42" -or $wRcOk -ne 0 -or $wRcTrap -ne 3) {
              throw "x86_64-windows-pe verification failed: out='$wOut' rcOk=$wRcOk rcTrap=$wRcTrap"
          }
          $wasmOk = Join-Path $env:TEMP "ut_ok.wasm"
          $wasmTrap = Join-Path $env:TEMP "ut_trap.wasm"
          [System.IO.File]::WriteAllBytes($wasmOk, (Compile-Target "wasm32-wasi" $srcOk))
          [System.IO.File]::WriteAllBytes($wasmTrap, (Compile-Target "wasm32-wasi" $srcTrap))
          $runner = 'const fs=require("fs"),{WASI}=require("wasi");const wasi=new WASI({version:"preview1"});const m=new WebAssembly.Module(fs.readFileSync(process.argv[2]));const i=new WebAssembly.Instance(m,wasi.getImportObject());process.exit(wasi.start(i)||0);'
          $runnerFile = Join-Path $env:TEMP "run_wasi.js"
          [System.IO.File]::WriteAllText($runnerFile, $runner)
          $wasmOut = (node --no-warnings $runnerFile $wasmOk) -join ","
          $wasmRcOk = $LASTEXITCODE
          node --no-warnings $runnerFile $wasmTrap
          $wasmRcTrap = $LASTEXITCODE
          Write-Host "WASM32 OK: '$wasmOut' (rc=$wasmRcOk) | TRAP: rc=$wasmRcTrap"
          if ($wasmOut -ne "55,42" -or $wasmRcOk -ne 0 -or $wasmRcTrap -ne 3) {
              throw "wasm32-wasi verification failed: out='$wasmOut' rcOk=$wasmRcOk rcTrap=$wasmRcTrap"
          }
