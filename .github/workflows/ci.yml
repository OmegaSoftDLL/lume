name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stage0:
    name: Stage 0 (lume0, C) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install QEMU (Linux x86-64 bare-metal kernel boot #227)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Build
        run: make -C bootstrap/lume0
      - name: Test
        run: make -C bootstrap/lume0 test
      - name: Test under ASan/UBSan
        run: make -C bootstrap/lume0 asan

  docs:
    name: Documentation & examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required files exist
        run: |
          set -e
          for f in README.md CHANGELOG.md .github/workflows/release.yml \
                   docs/00-catalog.md docs/01-survey.md docs/02-principles.md \
                   docs/03-specification.md docs/04-roadmap.md docs/05-vision.md \
                   grammar/lume.ebnf examples/README.md \
                   formal/lean/LumeCore.lean formal/lean/README.md \
                   tests/llm_gen_eval/system_prompt.md scripts/check-llm-gen-eval.sh; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Mechanised Lume-Core proofs in Lean 4 (#213 — zero sorry/axiom)
        run: |
          set -e
          ! grep -En '\bsorry\b|\baxiom\b' formal/lean/LumeCore.lean || { echo "sorry/axiom found in formal/lean/LumeCore.lean"; exit 1; }
          for i in 1 2 3; do
            curl --retry 3 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.14.0 && break || sleep 5
          done
          "$HOME/.elan/bin/lean" formal/lean/LumeCore.lean
      - name: Every example is listed in examples/README.md
        run: |
          set -e
          for f in examples/*.lume examples/future/*.lume; do
            name=${f#examples/}
            grep -q "$name" examples/README.md || { echo "$name not listed in examples/README.md"; exit 1; }
          done
      - name: No tabs in Lume sources or docs
        run: |
          ! grep -rnP '\t' --include='*.lume' --include='*.md' --include='*.ebnf' --exclude='bad_*.lume' . || { echo "tabs found"; exit 1; }
      - name: Canonical formatting check (lume fmt --check)
        run: |
          set -e
          files=$(find . -name '*.lume' -not -name 'bad_*' -not -path './.git/*' | sort)
          if [ -n "$files" ]; then
            ./lume fmt --check $files
          fi
      - name: Spec cites principles that exist
        run: |
          set -e
          for p in $(grep -oE '\bP[0-9]+\b' docs/03-specification.md | sort -u); do
            grep -q "\*\*$p " docs/02-principles.md || { echo "spec cites $p but principles.md lacks it"; exit 1; }
          done

  bootstrap:
    name: Self-host bootstrap (stage2 == stage3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: make bootstrap
        run: make bootstrap
      - name: Verify Zero-C steady state (no cc/as/ld)
        run: make zero-c
      - name: Canonical Lume-Core & surface formatting check (lume fmt --check)
        run: |
          set -e
          files=$(find . -name '*.lume' -not -name 'bad_*' -not -path './.git/*' | sort)
          if [ -n "$files" ]; then
            ./lume fmt --check compiler/stage1/f4_core.src $files
          else
            ./lume fmt --check compiler/stage1/f4_core.src
          fi

  zero-c:
    name: Zero-C steady state (no cc/as/ld)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: make zero-c
        run: make zero-c
