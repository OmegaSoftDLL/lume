name: Homebrew package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: Install and run Homebrew formula (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - name: Install released archive through Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install --formula ./Formula/lume.rb
      - name: Run installed toolchain and verify its manifest
        run: |
          brew test ./Formula/lume.rb
          "$(brew --prefix lume)/bin/lume" self verify | grep -q '"manifest_verified":true'
