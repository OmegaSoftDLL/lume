name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v0.3.0) for dry-run packaging'
        required: false
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Self-Hosted Lume Toolchain (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap self-hosted toolchain (stage2 == stage3) & verify Zero-C steady state
        run: |
          make bootstrap
          make zero-c

      - name: Package release archive & SHA256SUMS
        run: |
          set -eu
          VER="${GITHUB_REF_NAME:-${{ inputs.tag || 'v0.3.0' }}}"
          PKG="lume-${VER}-linux-x86_64"
          mkdir -p "dist/${PKG}/bin"
          cp build/bootstrap/lumec3 "dist/${PKG}/bin/lumec"
          cp build/bootstrap/lasm3  "dist/${PKG}/bin/lasm"
          cp build/bootstrap/lcli3  "dist/${PKG}/bin/lcli"
          cp bootstrap/lume0/lume0  "dist/${PKG}/bin/lume0"
          cp lume                   "dist/${PKG}/bin/lume"
          chmod +x "dist/${PKG}/bin/lumec" "dist/${PKG}/bin/lasm" "dist/${PKG}/bin/lcli" "dist/${PKG}/bin/lume0" "dist/${PKG}/bin/lume"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/${PKG}/" 2>/dev/null || cp README.md CHANGELOG.md "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          cp build/bootstrap/lumec3 dist/lumec-linux-x86_64
          cp build/bootstrap/lasm3  dist/lasm-linux-x86_64
          cp bootstrap/lume0/lume0  dist/lume0-linux-x86_64
          (
            cd dist
            sha256sum "${PKG}.tar.gz" lumec-linux-x86_64 lasm-linux-x86_64 lume0-linux-x86_64 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: lume-linux-x86_64-release
          path: |
            dist/*.tar.gz
            dist/lumec-linux-x86_64
            dist/lasm-linux-x86_64
            dist/lume0-linux-x86_64
            dist/SHA256SUMS

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            dist/*.tar.gz \
            dist/lumec-linux-x86_64 \
            dist/lasm-linux-x86_64 \
            dist/lume0-linux-x86_64 \
            dist/SHA256SUMS \
            --title "Lume ${TAG}" \
            --generate-notes
